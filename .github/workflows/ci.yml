# Build, then the fast checks and controls (`make test-checks`), the tests of
# the test infrastructure where their code changed (`make test-infra`) and the
# pipeline cases (`make test-cases`), on every pull request and every push to
# main, on Linux; beside them, the pretext tier (`make test-pretext`) at a
# pinned pretext commit.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TSCERT_STAGE_MEMORY: "4"
    steps:
      - uses: actions/checkout@v4

      # The compiler's sandbox (STAGE-STORE.md, observed stages): bubblewrap,
      # with the unprivileged user namespaces Ubuntu's AppArmor restricts.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore the Lean build
        id: lake
        uses: actions/cache/restore@v4
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/**/*.lean', 'lean/c/**', 'lean/lakefile.toml') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}-

      - name: Install the node dependencies
        run: make setup

      - name: Build
        run: make build

      - name: Save the Lean build
        if: steps.lake.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lean/.lake
          key: ${{ steps.lake.outputs.cache-primary-key }}

      - name: Fast checks and controls
        run: make test-checks

      # The tests of the test infrastructure (`make test-infra`), only where
      # a change touches the code they test or the tests themselves; on a
      # push or a run with no base to compare, always.
      - name: Infrastructure tests
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths='^(pipeline/(stages|stage-store|stage-execution|run-directory|in-process-execution|parse-stage|verify-source|module-interfaces)\.mts|pipeline/runner/|tools/(files|compiler-channel|compiler-processes|declaration-session|declaration-graph)\.mts|tests/(stage-store|observed-stages|session-reuse|single-pass-controls)\.mts|test-all\.sh|Makefile|\.github/workflows/ci\.yml)'
          if [ -n "$BASE" ] && git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null &&
              ! git diff --name-only "$BASE" HEAD | grep -qE "$paths"; then
            echo "no infrastructure code changed since $BASE"
          else
            make test-infra
          fi

      # C3 and C4 over the corpus (tests/compiler-api-shapes.mts): about a
      # minute, outside the fast checks.
      - name: Compiler-API shapes
        run: make compiler-api-shapes

      # A runner has 4 CPUs: a stage's limit three times the 60 s a
      # 12-core machine's cases are calibrated to.
      - name: Pipeline cases
        env:
          TSCERT_STEP_LIMIT: "180"
        run: make test-cases

  # The pretext tier (`make test-pretext`, tests/pretext-tier.mts) at the
  # pinned commit of cristianoc/pretext's tscert-bounds, the annotated
  # pretext, whose tip it follows: it fails where a
  # function recorded as verified for that commit
  # (tests/pretext-tier-expected.json) no longer verifies. It guards
  # pretext's functions while the work on the rules of the note "Tolerant
  # frames" is in progress, and is removed when that work is finished.
  pretext:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TSCERT_STAGE_MEMORY: "4"
      PRETEXT_COMMIT: 0dafecb370638ddc244909cc949efaf85b1efa26
    steps:
      - uses: actions/checkout@v4

      # pretext's sources at the pinned commit; the tier's own project reads
      # them with no type package, so pretext needs no install.
      - uses: actions/checkout@v4
        with:
          repository: cristianoc/pretext
          ref: ${{ env.PRETEXT_COMMIT }}
          path: pretext

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore the Lean build
        uses: actions/cache/restore@v4
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/**/*.lean', 'lean/c/**', 'lean/lakefile.toml') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}-

      - name: Install the node dependencies
        run: make setup

      - name: Build
        run: make build

      # A runner has 4 CPUs: a stage's limit three times the 60 s a
      # 12-core machine's stages are calibrated to, as the pipeline cases'.
      - name: Pretext tier
        env:
          TSCERT_STEP_LIMIT: "180"
        run: make test-pretext PRETEXT=pretext
