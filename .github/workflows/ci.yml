# Build, then the fast checks and controls (`make test-checks`) and the
# pipeline cases (`make test-cases`), together `make test`, on every pull
# request and every push to main, on Linux.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TSCERT_STAGE_MEMORY: "4"
    steps:
      - uses: actions/checkout@v4

      # The compiler's sandbox (STAGE-STORE.md, observed stages): bubblewrap,
      # with the unprivileged user namespaces Ubuntu's AppArmor restricts.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Restore the Lean build
        id: lake
        uses: actions/cache/restore@v4
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}-${{ hashFiles('lean/**/*.lean', 'lean/c/**', 'lean/lakefile.toml') }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}-

      - name: Install the node dependencies
        run: make setup

      - name: Build
        run: make build

      - name: Save the Lean build
        if: steps.lake.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lean/.lake
          key: ${{ steps.lake.outputs.cache-primary-key }}

      - name: Fast checks and controls
        run: make test-checks

      # C3 and C4 over the corpus (tests/compiler-api-shapes.mts): about a
      # minute, outside the fast checks.
      - name: Compiler-API shapes
        run: make compiler-api-shapes

      # A runner has 4 CPUs: a stage's limit three times the 60 s a
      # 12-core machine's cases are calibrated to.
      - name: Pipeline cases
        env:
          TSCERT_STEP_LIMIT: "180"
        run: make test-cases
