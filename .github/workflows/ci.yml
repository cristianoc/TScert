# Build, then the fast checks and controls (`make test-checks`), the tests of
# the test infrastructure where their code changed (`make test-infra`) and the
# pipeline cases (`make test-cases`), on pull requests and pushes to main.
# The pretext tier checks a pinned pretext commit. Pushes to single-pass
# seed the Lean cache for PRs and the census.
name: CI

on:
  pull_request:
  push:
    branches: [main, single-pass]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Preview URLs use the PR head SHA. Build that commit for same-repo PRs.
env:
  TSCERT_BUILD_REF: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}

jobs:
  lean-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TSCERT_BUILD_REF }}

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/build-lean
        with:
          save-cache: "true"

      - uses: actions/upload-artifact@v6
        with:
          name: verifier-linux-x64
          path: lean/.lake/build/bin/verifier
          if-no-files-found: error
          retention-days: 7

      # Keep executable bits and the link response file for the mutation tests.
      - name: Pack the Lean build
        if: github.event_name != 'push' || github.ref != 'refs/heads/single-pass'
        run: tar -cf "$RUNNER_TEMP/lean-build.tar" lean/.lake

      - uses: actions/upload-artifact@v6
        if: github.event_name != 'push' || github.ref != 'refs/heads/single-pass'
        with:
          name: lean-build
          path: ${{ runner.temp }}/lean-build.tar
          retention-days: 7
          compression-level: 3
          overwrite: true

  package-linux:
    needs: lean-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TSCERT_BUILD_REF }}

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/download-artifact@v7
        with:
          name: verifier-linux-x64
          path: lean/.lake/build/bin

      - name: Restore the verifier's executable bit
        run: chmod +x lean/.lake/build/bin/verifier

      - uses: ./.github/actions/package-cli
        with:
          platform: linux-x64

  package-macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TSCERT_BUILD_REF }}

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: ./.github/actions/build-lean
        with:
          save-cache: "true"

      - uses: ./.github/actions/package-cli
        with:
          platform: darwin-arm64

  publish-preview:
    needs: [package-linux, package-macos]
    if: >-
      github.repository == 'cristianoc/TScert' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TSCERT_BUILD_REF }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@v7
        with:
          pattern: tscert-*
          path: _build/preview-artifacts

      - name: Stage the CLI and platform packages
        run: |
          node dev/stage-preview-packages.mts \
            _build/preview-artifacts/tscert-linux-x64/*.tgz \
            _build/preview-artifacts/tscert-darwin-arm64/*.tgz \
            _build/preview-packages

      - name: Publish commit-pinned research previews
        run: |
          npm ci --prefix .github/preview --ignore-scripts --no-audit --no-fund
          .github/preview/node_modules/.bin/pkg-pr-new publish --no-compact --commentWithSha --commentWithDev \
            --json _build/preview.json './_build/preview-packages/*'

      - name: Install the published preview
        run: |
          url=$(node -p 'require("./_build/preview.json").packages.find(p => p.name === "@cristianoc/tscert").url')
          mkdir _build/preview-consumer
          cd _build/preview-consumer
          printf '{"private":true}\n' > package.json
          npm install --ignore-scripts --no-audit --no-fund --save-dev "$url"
          ./node_modules/.bin/tscert --help
          printf 'Install this research preview with `npm install --save-dev %s`\n' "$url" >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: lean-build
    if: github.event_name != 'push' || github.ref != 'refs/heads/single-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TSCERT_STAGE_MEMORY: "4"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TSCERT_BUILD_REF }}

      # The compiler's sandbox (STAGE-STORE.md, observed stages): bubblewrap,
      # with the unprivileged user namespaces Ubuntu's AppArmor restricts.
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v7
        with:
          name: lean-build
          path: ${{ runner.temp }}

      - name: Unpack the Lean build
        run: tar -xf "$RUNNER_TEMP/lean-build.tar"

      - name: Install the node dependencies
        run: make setup

      - name: Fast checks and controls
        run: make test-checks

      # The tests of the test infrastructure (`make test-infra`), only where
      # a change touches the code they test or the tests themselves; on a
      # push or a run with no base to compare, always.
      - name: Infrastructure tests
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          paths='^(pipeline/(stages|stage-store|stage-execution|run-directory|in-process-execution|parse-stage|verify-source|module-interfaces)\.mts|pipeline/runner/|tools/(files|compiler-channel|compiler-processes|declaration-session|declaration-graph)\.mts|tests/(stage-store|observed-stages|session-reuse|single-pass-controls)\.mts|test-all\.sh|Makefile|\.github/(workflows/ci\.yml|actions/build-lean/))'
          if [ -n "$BASE" ] && git fetch --no-tags --depth=1 origin "$BASE" 2>/dev/null &&
              ! git diff --name-only "$BASE" HEAD | grep -qE "$paths"; then
            echo "no infrastructure code changed since $BASE"
          else
            make test-infra
          fi

      # C3 and C4 over the corpus (tests/compiler-api-shapes.mts): about a
      # minute, outside the fast checks.
      - name: Compiler-API shapes
        run: make compiler-api-shapes

      # A runner has 4 CPUs: a stage's limit three times the 60 s a
      # 12-core machine's cases are calibrated to.
      - name: Pipeline cases
        env:
          TSCERT_STEP_LIMIT: "180"
        run: make test-cases

  # The pretext tier (`make test-pretext`, tests/pretext-tier.mts) at the
  # pinned commit of cristianoc/pretext's tscert-bounds, the annotated
  # pretext, whose tip it follows: it fails where a
  # function recorded as verified for that commit
  # (tests/pretext-tier-expected.json) no longer verifies. It guards
  # pretext's functions while the work on the rules of the note "Tolerant
  # frames" is in progress, and is removed when that work is finished.
  pretext:
    needs: lean-build
    if: github.event_name != 'push' || github.ref != 'refs/heads/single-pass'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TSCERT_STAGE_MEMORY: "4"
      PRETEXT_COMMIT: 3084c5096104a415067d3560be9b27aec4c2466a
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TSCERT_BUILD_REF }}

      # pretext's sources at the pinned commit; the tier's own project reads
      # them with no type package, so pretext needs no install.
      - uses: actions/checkout@v5
        with:
          repository: cristianoc/pretext
          ref: ${{ env.PRETEXT_COMMIT }}
          path: pretext

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v7
        with:
          name: lean-build
          path: ${{ runner.temp }}

      - name: Unpack the Lean build
        run: tar -xf "$RUNNER_TEMP/lean-build.tar"

      - name: Install the node dependencies
        run: make setup

      # A runner has 4 CPUs: a stage's limit three times the 60 s a
      # 12-core machine's stages are calibrated to, as the pipeline cases'.
      - name: Pretext tier
        env:
          TSCERT_STEP_LIMIT: "180"
        run: make test-pretext PRETEXT=pretext
