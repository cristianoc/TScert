name: Semantic Diff

# Renders the commit records of each pull request (dev/commit-records.mts) as
# a review page, published on the gh-pages branch at
# semantic-diff/pr-<number>/, and keeps one comment on the pull request that
# links it and lists its commits; each push updates the page and the comment.
# A deep-dive deck the pull request changes (docs/deep-dives/<name>/) is
# built too (dev/deck-cli.mts), its page marking in yellow what changed
# since the deck's approved version (the `SINCE=` of its header) or, for a
# deck with none, since the base; the page is published beside the records,
# at semantic-diff/pr-<number>/decks/<name>.html, and linked from a comment
# of its own that mentions the repository's owner, whose approval it waits for.
# Then each commit's message is checked as a commit record
# (bin/git_hooks/commit_record.sh --check), last, so the page and the comment
# appear either way.
#
# A pull request from a branch of this repository runs on pull_request, with
# the renderer of its merge into the base branch. A pull request from a fork
# runs on pull_request_target, which GitHub takes from the default branch with
# write permissions: it runs only the default branch's code, and reads the
# fork's commits as git data, never checking them out.
#
# Pages are never deleted, so the links in the comments stay valid after a
# pull request is merged or closed.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: semantic-diff-${{ github.event_name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  render:
    if: >-
      (github.event_name == 'pull_request') ==
      (github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.pull_request.base.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "26"

      - name: Render the commit records
        run: |
          git fetch --no-tags --filter=blob:none origin "refs/pull/${PR_NUMBER}/head:refs/heads/pr-${PR_NUMBER}"
          base=$(git merge-base "$BASE_SHA" "pr-${PR_NUMBER}")
          head=$(git rev-parse --short=9 "pr-${PR_NUMBER}")
          echo "RANGE=${base}..pr-${PR_NUMBER}" >> "$GITHUB_ENV"
          echo "HEAD_SHORT=${head}" >> "$GITHUB_ENV"
          echo "BASE=${base}" >> "$GITHUB_ENV"
          mkdir -p semantic-diff
          node dev/commit-records.mts --out semantic-diff/index.html "${base}..pr-${PR_NUMBER}"

      # A deck's source is code: it runs only for a branch of this
      # repository, never for a fork's pull request.
      - name: Build the changed decks
        if: github.event_name == 'pull_request'
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          mkdir -p semantic-diff/decks
          : > semantic-diff/decks.md
          : > semantic-diff/deck-failures.txt
          for deck in $(git diff --name-only "$RANGE" -- docs/deep-dives | cut -d/ -f3 | sort -u); do
            [ -f "docs/deep-dives/$deck/deck.mts" ] || continue
            approved=$(grep -m1 -oE 'SINCE=[0-9a-f]+' "docs/deep-dives/$deck/deck.mts" | cut -d= -f2 || true)
            since=$BASE
            if [ -n "$approved" ] && git cat-file -e "${approved}^{commit}" 2>/dev/null; then since=$approved; fi
            if ! node dev/deck-cli.mts "$deck" --since "$since" > "semantic-diff/deck-$deck.log" 2>&1; then
              echo "$deck: $(grep -v '^page:' "semantic-diff/deck-$deck.log" | tail -3 | tr '\n' ' ')" >> semantic-diff/deck-failures.txt
            fi
            cat "semantic-diff/deck-$deck.log"
            if [ -n "$(git status --porcelain -- "docs/deep-dives/$deck/project")" ]; then
              echo "$deck: project/ differs from what deck.mts builds" >> semantic-diff/deck-failures.txt
            fi
            page=$(sed -n 's/^page: //p' "semantic-diff/deck-$deck.log")
            [ -n "$page" ] && cp "$page" "semantic-diff/decks/$deck.html"
            marked=$(sed -n 's/^marked since [^:]*: \([^;]*\);.*/\1/p' "semantic-diff/deck-$deck.log")
            if [ "$since" = "$approved" ]; then from="its approved version \`${since:0:9}\`"; else from="the base \`${since:0:9}\`"; fi
            echo "- [${deck}](decks/${deck}.html?v=${HEAD_SHORT}): marked since ${from}; slides changed: ${marked:-none}" >> semantic-diff/decks.md
          done

      - name: Publish the page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$remote" gh-pages >/dev/null; then
            git clone --quiet --depth 1 --branch gh-pages "$remote" pages
          else
            git init --quiet -b gh-pages pages
            git -C pages remote add origin "$remote"
          fi
          mkdir -p "pages/semantic-diff/pr-${PR_NUMBER}"
          cp semantic-diff/index.html "pages/semantic-diff/pr-${PR_NUMBER}/index.html"
          if [ -d semantic-diff/decks ] && [ -n "$(ls semantic-diff/decks)" ]; then
            mkdir -p "pages/semantic-diff/pr-${PR_NUMBER}/decks"
            cp semantic-diff/decks/*.html "pages/semantic-diff/pr-${PR_NUMBER}/decks/"
          fi
          touch pages/.nojekyll
          cd pages
          # The identity of the commit and of its rebase onto another page.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit --quiet -m "Semantic diff of pull request ${PR_NUMBER} at ${HEAD_SHORT}"
          # Pull requests publish concurrently: rebase onto another's page and retry.
          for attempt in 1 2 3 4 5; do
            if git push --quiet origin gh-pages; then exit 0; fi
            git pull --quiet --rebase origin gh-pages
          done
          exit 1

      - name: Write the comment
        run: |
          owner=${GITHUB_REPOSITORY%%/*}
          repo=${GITHUB_REPOSITORY#*/}
          url="https://${owner}.github.io/${repo}/semantic-diff/pr-${PR_NUMBER}/?v=${HEAD_SHORT}"
          {
            echo "**Semantic diff** of this pull request at \`${HEAD_SHORT}\`: [the commit records, rendered](${url})"
            echo
            git log --reverse --no-merges --format='- `%h` %s' "$RANGE"
          } > semantic-diff/comment.md
          # A changed deck waits for the owner's approval: its own comment
          # mentions the owner, which notifies them when it is first made.
          if [ -s semantic-diff/decks.md ]; then
            {
              echo "@${GITHUB_REPOSITORY_OWNER} **Decks changed** in this pull request, built with the changes marked, for your approval:"
              echo
              sed "s#](decks/#](https://${owner}.github.io/${repo}/semantic-diff/pr-${PR_NUMBER}/decks/#" semantic-diff/decks.md
            } > semantic-diff/decks-comment.md
          fi

      - name: Comment the semantic diff
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ github.event.pull_request.number }}
          # The pull request's one comment, edited in place on each push.
          comment-tag: semantic-diff
          mode: upsert
          file-path: semantic-diff/comment.md

      - name: Comment the changed decks
        if: hashFiles('semantic-diff/decks-comment.md') != ''
        uses: thollander/actions-comment-pull-request@v3
        with:
          pr-number: ${{ github.event.pull_request.number }}
          comment-tag: deck-changes
          mode: upsert
          file-path: semantic-diff/decks-comment.md
          # Posted as the repository's machine user where its token is set,
          # since GitHub emails the owner a mention by a user, not by the
          # workflow's own bot; without the secret, as the workflow's bot.
          github-token: ${{ secrets.TSCERT_BOT_TOKEN || github.token }}

      # Last, so that the page and the comment show the records either way.
      - name: Check the commit records
        run: |
          failed=0
          for commit in $(git rev-list --reverse --no-merges "$RANGE"); do
            git log -1 --format=%B "$commit" > message.txt
            if ! bin/git_hooks/commit_record.sh message.txt --check; then
              echo "  in $(git log -1 --format='%h %s' "$commit")"
              failed=1
            fi
          done
          if [ -s semantic-diff/deck-failures.txt ]; then
            echo "decks:"; cat semantic-diff/deck-failures.txt
            failed=1
          fi
          exit $failed
