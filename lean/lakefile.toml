name = "verification"
defaultTargets = ["verifier", "Verification"]

[[lean_lib]]
name = "Verification"
globs = [
  "Verification.Semantics.+",
  "Verification.Types.+",
  "Verification.Programs.+",
  "Verification.Source.+",
  "Verification.Tests.+",
]
# A warning fails the build: the development keeps none.
leanOptions = { warningAsError = true }

[[lean_exe]]
name = "verifier"
root = "Main"
leanOptions = { warningAsError = true }
# Startup initializes the Lean runtime only (c/runtime_init.c). Lake passes
# these arguments before the Lean libraries; the path is relative to this
# directory, where Lake runs. Lake traces the arguments, not the file: after
# editing the C file, remove .lake/build/bin/verifier to relink.
moreLinkArgs = ["c/runtime_init.c"]
